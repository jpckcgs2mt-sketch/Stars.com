<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивна зірка</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d002e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .star-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .interactive-star {
            width: 100px;
            height: 100px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd700"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>');
            background-size: contain;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.2s;
        }

        .interactive-star:hover {
            transform: scale(1.1);
        }

        .interactive-star:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="star-background" id="starBackground"></div>
    <div class="interactive-star" id="starButton" onclick="playSound()"></div>

    <audio id="soundEffect">
        <source src="your-sound-file.mp3" type="audio/mpeg">
        Ваш браузер не підтримує аудіо.
    </audio>

    <script>
        const background = document.getElementById('starBackground');
        const numberOfStars = 100;

        for (let i = 0; i < numberOfStars; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            
            star.style.setProperty('--duration', `${Math.random() * 3 + 1}s`);
            
            background.appendChild(star);
        }

        function playSound() {
            const sound = document.getElementById('soundEffect');
            sound.currentTime = 0;
            sound.play();
        }
    </script>
</body>
</html>
