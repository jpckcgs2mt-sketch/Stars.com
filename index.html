<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP3 Плеєр з зірочками</title>
<style>
body {
margin: 0;
padding: 0;
background: #090a0f;
color: #fff;
font-family: Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
}
#stars-container {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: -1;
overflow: hidden;
}
.star {
position: absolute;
background-color: #ffffff;
border-radius: 50%;
opacity: 0.8;
animation: fall linear infinite;
}
@keyframes fall {
0% {
transform: translateY(-10px);
opacity: 0;
}
10% {
opacity: 1;
}
100% {
transform: translateY(105vh);
opacity: 0;
}
}
.player-container {
background: rgba(255, 255, 255, 0.1);
backdrop-filter: blur(10px);
padding: 30px;
border-radius: 15px;
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
border: 1px solid rgba(255, 255, 255, 0.18);
text-align: center;
z-index: 1;
}
input[type="file"] {
display: none;
}
.upload-btn {
background: #6200ea;
color: white;
padding: 12px 24px;
border-radius: 25px;
cursor: pointer;
font-size: 16px;
font-weight: bold;
transition: background 0.3s, transform 0.2s;
display: inline-block;
}
.upload-btn:hover {
background: #7c4dff;
transform: scale(1.05);
}
audio {
margin-top: 20px;
width: 100%;
display: none;
}
#file-name {
margin-top: 15px;
font-size: 14px;
color: #d1d1d1;
max-width: 250px;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}
</style>
</head>
<body>
<div id="stars-container"></div>
<div class="player-container">
<label for="audio-upload" class="upload-btn">Вибрати MP3 Файл</label>
<input type="file" id="audio-upload" accept=".mp3">
<div id="file-name"></div>
<audio id="audio-player" controls></audio>
</div>
<script>
const starsContainer = document.getElementById('stars-container');
const audioUpload = document.getElementById('audio-upload');
const audioPlayer = document.getElementById('audio-player');
const fileNameDisplay = document.getElementById('file-name');
function createStar() {
const star = document.createElement('div');
star.classList.add('star');
const size = Math.random() * 3 + 1;
star.style.width = ⁠${size}px⁠;
star.style.height = ⁠${size}px⁠;
star.style.left = ⁠${Math.random() * 100}%⁠;
const duration = Math.random() * 3 + 2;
star.style.animationDuration = ⁠${duration}s⁠;
const delay = Math.random() * 5;
star.style.animationDelay = ⁠${delay}s⁠;
starsContainer.appendChild(star);
setTimeout(() => {
star.remove();
}, duration * 1000 + delay * 1000);
}
setInterval(createStar, 300);
audioUpload.addEventListener('change', function(event) {
const file = event.target.files[0];
if (file) {
if (file.type === 'audio/mp3' || file.name.endsWith('.mp3')) {
fileNameDisplay.textContent = file.name;
const fileURL = URL.createObjectURL(file);
audioPlayer.src = fileURL;
audioPlayer.style.display = 'block';
audioPlayer.play();
} else {
alert('Будь ласка, завантажте тільки MP3 файл.');
audioUpload.value = '';
fileNameDisplay.textContent = '';
audioPlayer.style.display = 'none';
}
}
});
</script>
</body>
</html>
