<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивна зірочка</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            font-family: sans-serif;
            color: #fff;
        }

        /* Розмиті зірочки на фоні */
        .bg-stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.15;
            filter: blur(2px);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Велика кругла кнопка зі зіркою */
        .star-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
            transition: transform 0.1s, box-shadow 0.2s;
            font-size: 60px;
            color: #fff;
        }

        .star-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Панель завантаження звуку */
        .uploader {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px dashed #555;
            font-size: 14px;
        }

        input[type="file"] {
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="bg-stars"></div>

    <div class="container">
        <!-- Велика кнопка зі зіркою -->
        <div class="star-button" id="playBtn" title="Натисніть, щоб відтворити звук">★</div>
        
        <!-- Завантаження файлу -->
        <div class="uploader">
            <label for="audioFile">Завантажити звук: </label>
            <input type="file" id="audioFile" accept="audio/*">
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const fileInput = document.getElementById('audioFile');
        const playBtn = document.getElementById('playBtn');
        const audioPlayer = document.getElementById('audioPlayer');

        let audioSrc = null;

        // Користувач завантажує свій файл
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                audioSrc = URL.createObjectURL(file);
                audioPlayer.src = audioSrc;
                alert('Звук успішно завантажено! Тепер натискайте на зірочку.');
            }
        });

        // Натискання на велику кнопку зі зіркою
        playBtn.addEventListener('click', function() {
            if (!audioSrc) {
                alert('Будь ласка, спочатку завантажте звуковий файл нижче.');
                return;
            }
            audioPlayer.currentTime = 0;
            audioPlayer.play().catch(error => {
                console.log('Помилка відтворення:', error);
            });
        });
    </script>

</body>
</html>
